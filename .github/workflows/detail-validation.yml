name: Detail validation
on:
  push:
    branches: [main, codex/detail-refinement]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run test:detail
      - run: npm run test:offline
      - run: npx playwright test --project=chromium --project="Mobile Chrome" --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-game-detail-evidence
          path: |
            output/detail-browser
            output/offline-browser
            playwright-report
          retention-days: 14
