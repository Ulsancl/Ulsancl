name: Detail validation
on:
  push:
    branches: [main, codex/detail-refinement]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run test:detail
      - run: npm run test:offline
      - run: npx playwright test --project=chromium --project="Mobile Chrome" --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stock-game-detail-evidence
          path: |
            output/detail-browser
            output/offline-browser
            playwright-report
          retention-days: 14
